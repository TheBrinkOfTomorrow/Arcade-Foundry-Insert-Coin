# The games the app lists, in the library's order (a card's versions in
# this order), one [[game]] per ROM set. The facts about each game (title,
# year, board, controls) come from its core's games.toml; this file has the
# words the app shows. scripts/gen_games.py writes Catalog's game list, the
# Linux app's, build_cores.py's lists and GAMES.md's tables from both (CI
# checks they match). Keys: cores/arcade-foundry-cores-common/tools/games/afgames.py (APP_KEYS).
# In a hint, {W} {S} {E} {N} are the face buttons (X A B Y on Apple
# devices, West South East North on Linux).

